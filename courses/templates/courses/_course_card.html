{% load i18n static course_extras %}
<a href="{% url 'courses:course_detail' course.slug %}"
   class="block border border-slate-200 rounded-xl overflow-hidden hover:shadow-lg transition-shadow bg-white"
   x-show="(category === 'all' || category === '{{ course.category }}')
           && (topic === 'all' || topic === '{{ course.topic }}')
           && (!search || '{{ course.title|escapejs }}'.toLowerCase().includes(search.toLowerCase()))">
    <img src="{% static course|course_thumbnail %}" alt="{{ course.title }}" class="h-32 w-full object-cover">
    <div class="p-4">
        <h3 class="font-bold text-blue-950 mb-2 leading-snug">{{ course.title }}</h3>
        <div class="flex items-center gap-3 text-xs text-slate-500 mb-3">
            <span>&#128337; {{ course.duration }}</span>
            <span>&#128200; {{ course.get_level_display }}</span>
        </div>
        <div class="flex items-center justify-between">
            <span class="font-extrabold text-amber-600">
                {% if course.has_price %}${{ course.price_usd }}{% else %}{% trans "Contact us" %}{% endif %}
            </span>
            <span class="text-xs font-semibold text-blue-950 border border-blue-950 rounded px-2 py-1">
                {% trans "View Course" %} &rarr;
            </span>
        </div>
    </div>
</a>
